name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q                      # the committed model tables
      - run: python prep/build_dataset.py   # rebuild from the raw World Bank file
      - run: pytest -q                      # and check again
